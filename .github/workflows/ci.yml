name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Battle retention — fail fast if pre-cutoff replays reappear
  # ---------------------------------------------------------------------------
  battle-retention:
    name: Battle retention (id > 870230019)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Enforce RETENTION.md
        run: python3 battles/scripts/enforce_retention.py

  # ---------------------------------------------------------------------------
  # 2) Build + unit tests (Bazel)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & unit tests (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.bazel', '**/*.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.temp }}/bazel-disk-cache
          repository-cache: ${{ runner.temp }}/bazel-repo-cache

      - name: Show Bazel version
        run: bazel --version

      - name: Build all targets
        run: bazel build --config=ci //...

      - name: Run Bazel unit tests
        run: bazel test --config=ci //... --test_output=errors

  # ---------------------------------------------------------------------------
  # 3) PHYSICS GATE — MERGE_PHYSICS_OK (compound)
  #
  # Job id physics-accuracy is FROZEN (see docs/VERIFICATION_TRUTH_POLICY.md).
  # Code SSoT: src/physics/physics.h
  #
  # MERGE_PHYSICS_OK := this job green := (U) ∧ (A) ∧ (B)
  #   (U) bazel test //src/physics:test_physics
  #   (A) MAD_POD_GATE_STRICT=1 python3 sim/verify_battles.py --gate battles/test_session_battles
  #   (B) MAD_POD_GATE_STRICT=1 python3 battles/scripts/verify_golden_corpus.py --tier pass
  # Driver: Bazel //src/physics:replay_driver copied to sim/replay_driver
  # Tolerances: sim/tolerance_policy.py GATE_*
  #
  # C++ //src/physics:verify_battles is built for compile smoke / local DIAGNOSTIC
  # (stricter compare). It is NOT the merge corpus verifier.
  # PR_MERGE_OK also requires battle-retention and build-and-test.
  # ---------------------------------------------------------------------------
  physics-accuracy:
    name: Physics gate (compound)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [battle-retention]
    steps:
      - uses: actions/checkout@v4

      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazel-disk-cache
          key: bazel-phys-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'src/physics/**') }}
          restore-keys: |
            bazel-phys-${{ runner.os }}-
            bazel-${{ runner.os }}-

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.temp }}/bazel-disk-cache
          repository-cache: ${{ runner.temp }}/bazel-repo-cache

      - name: Build physics targets (C++ diagnostic binary + tests + replay_driver)
        run: bazel build --config=ci //src/physics:verify_battles //src/physics:test_physics //src/physics:replay_driver

      - name: "Gate (U): test_physics"
        run: bazel test --config=ci //src/physics:test_physics --test_output=errors

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install replay_driver for Python harness
        run: |
          set -euo pipefail
          cp -f bazel-bin/src/physics/replay_driver sim/replay_driver
          chmod +x sim/replay_driver

      - name: "Gate (A): Python verify_battles --gate test_session"
        env:
          MAD_POD_GATE_STRICT: "1"
        run: |
          set -euo pipefail
          echo "=== MERGE_PHYSICS_OK component (A) ==="
          MAD_POD_GATE_STRICT=1 python3 sim/verify_battles.py --gate battles/test_session_battles
          echo "=== (A) PASSED ==="

      - name: "Gate (B): golden corpus --tier pass"
        env:
          MAD_POD_GATE_STRICT: "1"
        run: |
          set -euo pipefail
          echo "=== MERGE_PHYSICS_OK component (B) ==="
          MAD_POD_GATE_STRICT=1 python3 battles/scripts/verify_golden_corpus.py --tier pass
          echo "=== (B) PASSED ==="

      - name: Sanity — golden corpus present
        run: |
          n=$(find battles/golden_physics_battles/battles -name 'battle_*.json' | wc -l)
          echo "golden_physics_battles: $n"
          test "$n" -ge 150
          n2=$(find battles/test_session_battles -name 'battle_*.json' | wc -l)
          echo "test_session_battles: $n2"
          test "$n2" -ge 100

      - name: Verification truth policy checker
        run: python3 sim/check_verification_policy.py
